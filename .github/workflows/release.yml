name: Release

# 推送 v 开头的 tag（如 v0.1.0）时自动编译并发布未签名 IPA；
# 也可以在 Actions 页面手动运行，指定版本号。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0；留空则用 App/project.yml 里的 MARKETING_VERSION）"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 编译未签名 IPA
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 26
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -t. -k2,2n -k3,3n | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::运行器上没有 Xcode 26，请调整工作流里的版本要求"
            exit 1
          fi
          echo "使用 $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: 计算版本号
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' App/project.yml | head -n 1)
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号不合法：'$version'（需要形如 0.1.0 或 0.1.0-beta.1）"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "版本：${version}，build：${GITHUB_RUN_NUMBER}"

      - name: 缓存语音框架
        uses: actions/cache@v4
        with:
          path: Packages/SherpaTTS/Frameworks
          key: sherpa-${{ runner.os }}-${{ hashFiles('App/Tools/fetch_kokoro.sh') }}

      - name: 下载语音框架
        run: |
          set -euo pipefail
          if [ -d Packages/SherpaTTS/Frameworks/sherpa-onnx.xcframework ] &&
             [ -d Packages/SherpaTTS/Frameworks/onnxruntime.xcframework ]; then
            echo "框架已命中缓存"
          else
            bash App/Tools/fetch_kokoro.sh --frameworks-only
          fi

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 编译并打包 IPA
        run: bash App/Tools/build_ipa.sh "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.build }}"

      - name: 写入安装说明
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cat > dist/INSTALL.txt <<EOF
          柴阅 ${VERSION}（未签名 IPA）

          这是未签名的 iOS 安装包，不能直接安装：
          - 用 AltStore、Sideloadly 等工具，用自己的 Apple ID 重签后再装；
          - 或者下载源码，在 Xcode 里换成自己的开发团队后运行。

          文件说明：
          - Chaiyue-${VERSION}-unsigned.ipa  未签名安装包
          - Chaiyue-${VERSION}-dSYMs.zip     调试符号，用来符号化崩溃日志
          - SHA256SUMS.txt                   校验和

          校验：shasum -a 256 -c SHA256SUMS.txt
          EOF

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -maxdepth 1 -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有可发布的文件"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传"
            gh release upload "$TAG" "${files[@]}" --clobber
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh release create "$TAG" "${files[@]}" --verify-tag \
              --title "柴阅 ${VERSION}（未签名 IPA）" --generate-notes
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" \
              --title "柴阅 ${VERSION}（未签名 IPA）" --generate-notes
          fi
