name: Chaiyue
options:
  bundleIdPrefix: com.linchengbo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

packages:
  ReaderCore:
    path: ../Packages/ReaderCore
  SherpaTTS:
    path: ../Packages/SherpaTTS
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Chaiyue:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: ReaderCore
        product: ReaderModels
      - package: ReaderCore
        product: RuleEngine
      - package: ReaderCore
        product: ReaderServices
      - package: ReaderCore
        product: ReaderKit
      - package: ReaderCore
        product: ReaderPlatform
      - package: SherpaTTS
        product: SherpaTTS
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: Chaiyue
        PRODUCT_BUNDLE_IDENTIFIER: com.linchengbo.chaiyue
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Info.plist
    # 生成共享 scheme：CI 里 xcodebuild -scheme Chaiyue 才能直接编译/归档
    scheme:
      testTargets: []
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 柴阅
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        # 书源大量使用明文 HTTP 接口；再加 NSAllowsArbitraryLoadsInWebContent 之类的键，系统会忽略 NSAllowsArbitraryLoads
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 兼容 Legado 一键导入链接：yuedu://booksource/importonline?src=…
        CFBundleURLTypes:
          - CFBundleURLName: com.linchengbo.chaiyue.import
            CFBundleURLSchemes:
              - chaiyue
              - yuedu
              - legado
        CFBundleDocumentTypes:
          - CFBundleTypeName: 柴阅阅读主题
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.linchengbo.chaiyue.theme
          - CFBundleTypeName: 书源与书籍
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
              - public.plain-text
              - org.idpf.epub-container
          - CFBundleTypeName: 有声书与漫画
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - com.adobe.pdf
              - public.zip-archive
              - com.linchengbo.chaiyue.cbz
          - CFBundleTypeName: 电子书
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.linchengbo.chaiyue.mobi
              - com.linchengbo.chaiyue.azw
              - com.linchengbo.chaiyue.azw3
              - com.linchengbo.chaiyue.umd
              - com.linchengbo.chaiyue.fb2
              - com.linchengbo.chaiyue.fbz
              - org.openxmlformats.wordprocessingml.document
              - public.html
              - public.xhtml
              - net.daringfireball.markdown
              - public.rtf
        # 系统没有声明 CBZ、MOBI、AZW、UMD、FB2、Markdown 类型
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.linchengbo.chaiyue.mobi
            UTTypeDescription: MOBI 电子书
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobi
                - prc
              public.mime-type:
                - application/x-mobipocket-ebook
          - UTTypeIdentifier: com.linchengbo.chaiyue.azw
            UTTypeDescription: Kindle 电子书
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - azw
              public.mime-type:
                - application/vnd.amazon.ebook
          - UTTypeIdentifier: com.linchengbo.chaiyue.azw3
            UTTypeDescription: AZW3 电子书
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - azw3
              public.mime-type:
                - application/vnd.amazon.mobi8-ebook
          - UTTypeIdentifier: com.linchengbo.chaiyue.umd
            UTTypeDescription: UMD 电子书
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - umd
          - UTTypeIdentifier: com.linchengbo.chaiyue.fb2
            UTTypeDescription: FB2 电子书
            UTTypeConformsTo:
              - public.xml
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - fb2
              public.mime-type:
                - application/x-fictionbook+xml
          - UTTypeIdentifier: com.linchengbo.chaiyue.fbz
            UTTypeDescription: FB2 压缩电子书
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - fbz
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown 文本
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
              public.mime-type:
                - text/markdown
          - UTTypeIdentifier: com.linchengbo.chaiyue.cbz
            UTTypeDescription: CBZ 漫画
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
              public.mime-type:
                - application/vnd.comicbook+zip
        # 阅读主题包：AirDrop、文件 App 里可以直接用柴阅打开
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.linchengbo.chaiyue.theme
            UTTypeDescription: 柴阅阅读主题
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - chaiyuetheme
        LSSupportsOpeningDocumentsInPlace: false
        NSCameraUsageDescription: 扫描书源二维码
        ITSAppUsesNonExemptEncryption: false
